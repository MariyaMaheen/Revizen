services:
  - type: web
    name: revizen-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: google/gemini-2.5-flash
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PATH
        value: /opt/render/project/src/chroma_db
      - key: CHUNK_SIZE
        value: "512"
      - key: CHUNK_OVERLAP
        value: "64"
      - key: TOP_K
        value: "5"
      - key: DISTANCE_THRESHOLD
        value: "0.8"
      - key: CHAT_HISTORY_TURNS
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: DB_PATH
        value: /opt/render/project/src/revizen.db
      - key: INSIGHTS_PATH
        value: /opt/render/project/src/insights
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://your-app.vercel.app
